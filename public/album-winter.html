<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVANA — Фотоальбом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="gallery-header">
    <a href="index.html" class="brand"><img src="logo.png" alt="AWANA" class="brand-logo"></a>
    <div class="gallery-header-right">
      <a href="index.html" class="back" data-i18n="back">← Все альбомы</a>
      <div class="lang-switch" id="langSwitch"></div>
    </div>
  </header>

  <main>
    <section class="gallery-hero">
      <span class="eyebrow" id="albumDate">ALBUM</span>
      <h1><span id="albumTitle">AVANA</span></h1>
      <p id="albumText">Enter the password to open the photos.</p>
    </section>

    <section class="password-panel" id="passwordPanel">
      <div class="lock-icon">🔒</div>
      <h2 data-i18n="protected_title">Приватный альбом</h2>
      <p data-i18n="protected_text">Введите пароль, чтобы получить доступ к фотографиям.</p>
      <form id="passwordForm">
        <label class="sr-only" for="albumPassword" data-i18n="password_label">Пароль</label>
        <div class="password-row">
          <input id="albumPassword" type="password" autocomplete="current-password" placeholder="Пароль" required>
          <button type="submit" class="password-button" data-i18n="open_button">Открыть</button>
        </div>
        <p class="password-error" id="passwordError" role="alert"></p>
      </form>
    </section>

    <div class="photo-grid" id="photoGrid" hidden></div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="closeLightbox" aria-label="Закрыть">×</button>
    <button class="lightbox-nav prev" id="prevPhoto" aria-label="Предыдущее фото">←</button>
    <img id="lightboxImage" src="" alt="AVANA">
    <button class="lightbox-nav next" id="nextPhoto" aria-label="Следующее фото">→</button>
  </div>

  <script>
    window.AVANA_ALBUM = "winter";
    window.AVANA_ALBUM_DATE = "WINTER 2026";
    window.AVANA_ALBUM_TITLE = "Winter Meeting";
  </script>
  <script src="gallery.js"></script>
</body>
</html>
